[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  # Conventional commits (primary)
  { message = "^feat",              group = "Features"       },
  { message = "^fix",               group = "Bug Fixes"      },
  { message = "^perf",              group = "Performance"    },
  { message = "^refactor",          group = "Refactoring"    },
  { message = "^docs",              group = "Documentation"  },
  { message = "^test",              skip  = true             },
  { message = "^chore|^ci|^build",  group = "Maintenance"    },
  # Branch-name fallback for merge commits (e.g. "Merge pull request … from user/feature/foo")
  { message = "feature/",           group = "Features"       },
  { message = "hotfix/",            group = "Bug Fixes"      },
  { message = ".*",                 group = "Other"          },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
