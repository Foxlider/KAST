name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      publish_latest: ${{ steps.version.outputs.publish_latest }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate SemVer tag on caster
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable release tags must match vX.Y.Z. Got: $TAG" >&2
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          git fetch --no-tags origin +caster:refs/remotes/origin/caster

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/caster; then
            echo "Stable release tag $TAG must point to a commit reachable from origin/caster." >&2
            echo "Resolved tag commit: $TAG_COMMIT" >&2
            exit 1
          fi

          PUBLISH_LATEST="true"
          TAG_TYPE="$(git cat-file -t "$TAG")"
          if [ "$TAG_TYPE" = "tag" ] && git tag -l --format='%(contents)' "$TAG" | grep -Eiq '^Publish-Latest:[[:space:]]*false[[:space:]]*$'; then
            PUBLISH_LATEST="false"
          fi

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$PUBLISH_LATEST" >> "$GITHUB_OUTPUT"

  # ── 1. Gate: run tests before publishing anything ──────────────────────────
  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test  --no-build  --configuration Release --verbosity normal

  # ── 2. Native self-contained binaries ──────────────────────────────────────
  #   All targets cross-compiled on ubuntu-latest.
  #   Produces versioned archives uploaded as workflow artifacts.
  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar
          - rid: linux-arm64
            archive: tar
          - rid: win-x64
            archive: zip

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG"         >> $GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      - name: Publish
        run: |
          dotnet publish src/KAST.UI/KAST.UI.csproj \
            --configuration Release \
            --runtime      ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:MinVerVersionOverride=${{ steps.version.outputs.version }} \
            --output publish/${{ matrix.rid }}

      - name: Package → tar.gz
        if: matrix.archive == 'tar'
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf ../../kast-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.tar.gz .

      - name: Package → zip
        if: matrix.archive == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../kast-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.zip .

      - name: Generate checksum
        run: |
          archive="$(find . -maxdepth 1 -type f \( -name 'kast-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.tar.gz' -o -name 'kast-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.zip' \) -print -quit)"

          if [ -z "$archive" ]; then
            echo "Release archive was not found for ${{ matrix.rid }}." >&2
            exit 1
          fi

          sha256sum "$archive" > "$archive.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: kast-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.*
          if-no-files-found: error
          retention-days: 3

  # ── 3. Docker image → GHCR ─────────────────────────────────────────────────
  docker:
    name: Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize repository owner
        id: repo
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG"         >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/kast:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.owner }}/kast:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/kast:stable
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 4. GitHub Release (waits for all binaries + Docker) ───────────────────
  release:
    name: GitHub Release
    needs: [validate, publish, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG"         >> $GITHUB_OUTPUT

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:    ${{ steps.version.outputs.tag }}
          name:        "KAST ${{ steps.version.outputs.tag }}"
          body_path:   RELEASE_NOTES.md
          make_latest: ${{ needs.validate.outputs.publish_latest }}
          files: |
            kast-linux-x64-v*.tar.gz
            kast-linux-x64-v*.tar.gz.sha256
            kast-linux-arm64-v*.tar.gz
            kast-linux-arm64-v*.tar.gz.sha256
            kast-win-x64-v*.zip
            kast-win-x64-v*.zip.sha256

      - name: Update CHANGELOG.md on caster
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin +caster:refs/remotes/origin/caster
          git checkout -B caster origin/caster

          git cliff --output CHANGELOG.md
          git add CHANGELOG.md

          git diff --staged --quiet && echo "No changelog changes." && exit 0

          git commit -m "chore(release): update changelog for ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin caster
