name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  # ── 1. Gate: run tests before publishing anything ──────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test  --no-build  --configuration Release --verbosity normal

  # ── 2. Native self-contained binaries ──────────────────────────────────────
  #   All targets cross-compiled on ubuntu-latest.
  #   Produces versioned archives uploaded as workflow artifacts.
  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar
          - rid: linux-arm64
            archive: tar
          - rid: win-x64
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG"         >> $GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      - name: Publish
        run: |
          dotnet publish src/KAST.UI/KAST.UI.csproj \
            --configuration Release \
            --runtime      ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:MinVerVersionOverride=${{ steps.version.outputs.version }} \
            --output publish/${{ matrix.rid }}

      - name: Package → tar.gz
        if: matrix.archive == 'tar'
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf ../../kast-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.tar.gz .

      - name: Package → zip
        if: matrix.archive == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../kast-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: kast-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.*
          if-no-files-found: error
          retention-days: 3

  # ── 3. Docker image → GHCR ─────────────────────────────────────────────────
  docker:
    name: Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize repository owner
        id: repo
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG"         >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/kast:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.owner }}/kast:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 4. GitHub Release (waits for all binaries + Docker) ───────────────────
  release:
    name: GitHub Release
    needs: [publish, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG"         >> $GITHUB_OUTPUT

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:    ${{ steps.version.outputs.tag }}
          name:        "KAST ${{ steps.version.outputs.tag }}"
          body_path:   RELEASE_NOTES.md
          make_latest: true
          files: |
            kast-linux-x64-v*.tar.gz
            kast-linux-arm64-v*.tar.gz
            kast-win-x64-v*.zip

      - name: Update CHANGELOG.md on main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main

          git cliff --output CHANGELOG.md
          git add CHANGELOG.md

          git diff --staged --quiet && echo "No changelog changes." && exit 0

          git commit -m "chore: update CHANGELOG for ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin main
