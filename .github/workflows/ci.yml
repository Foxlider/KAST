name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  DOCKER_IMAGE: kast
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install Coverlet tool
        run: dotnet tool install --global coverlet.console

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarCloud analysis
        run: |
          dotnet sonarscanner begin /k:"Foxlider_KAST" /o:"foxlicorp" \
            /d:sonar.token="${{ env.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.coverage.exclusions="**/bin/**,**/obj/**,**/Data/Migrations/**" \
            /d:sonar.cs.opencover.reportsPaths="coverage.opencover.xml"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          coverlet ./tests/KAST.Tests/bin/Release/net10.0/KAST.Tests.dll \
            --target "dotnet" \
            --targetargs "test ./tests/KAST.Tests/KAST.Tests.csproj \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger trx;LogFileName=test-results.trx" \
            --format opencover \
            --output coverage.opencover.xml \
            --include-directory "./src"

      - name: End SonarCloud analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"
        if: always()

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4
      #   if: always()
      #   with:
      #     files: coverage.opencover.xml
      #     flags: unittests
      #     fail_ci_if_error: false
      #     token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize repository owner
        id: repo
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Compute nightly version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "v0.0.0")
          BASE_VER="${LAST_TAG#v}"

          echo "version=${BASE_VER}-nightly.${DATE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (main / PR — validate only, no push)
        if: github.ref != 'refs/heads/develop'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nightly image to GHCR
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/kast:nightly
            ghcr.io/${{ steps.repo.outputs.owner }}/kast:nightly-${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Nightly native binaries (develop only) ─────────────────────────────────
  nightly-packages:
    name: Nightly Package (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar
          - rid: linux-arm64
            archive: tar
          - rid: win-x64
            archive: zip

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute nightly version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "v0.0.0")
          BASE_VER="${LAST_TAG#v}"
          echo "version=${BASE_VER}-nightly.${DATE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=$DATE"       >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      - name: Publish
        run: |
          dotnet publish src/KAST.UI/KAST.UI.csproj \
            --configuration Release \
            --runtime      ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:MinVerVersionOverride=${{ steps.version.outputs.version }} \
            --output publish/${{ matrix.rid }}

      - name: Package → tar.gz
        if: matrix.archive == 'tar'
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf ../../kast-${{ matrix.rid }}-nightly.tar.gz .

      - name: Package → zip
        if: matrix.archive == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../kast-${{ matrix.rid }}-nightly.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.rid }}
          path: kast-${{ matrix.rid }}-nightly.*
          if-no-files-found: error
          retention-days: 7

  # ── Rolling nightly GitHub pre-release ────────────────────────────────────
  nightly-release:
    name: Nightly Release
    runs-on: ubuntu-latest
    needs: nightly-packages
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute nightly version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "v0.0.0")
          BASE_VER="${LAST_TAG#v}"
          echo "version=${BASE_VER}-nightly.${DATE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Download nightly artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-*
          merge-multiple: true

      - name: Delete previous nightly release + tag
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          git push origin :refs/tags/nightly            || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:    nightly
          name:        "Nightly – ${{ steps.version.outputs.version }}"
          prerelease:  true
          make_latest: false
          body: |
            🌙 **Automated nightly build** from the `develop` branch.

            | | |
            |---|---|
            | **Version** | `${{ steps.version.outputs.version }}` |
            | **Commit** | [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
            | **Date** | `${{ steps.version.outputs.date }}` |

            > ⚠️ Nightly builds are automatically generated from the latest development code and may be unstable.
            > Use [tagged releases](../../releases/latest) for production deployments.

            ### Downloads
            | Platform | File |
            |---|---|
            | Linux x64 | `kast-linux-x64-nightly.tar.gz` |
            | Linux arm64 | `kast-linux-arm64-nightly.tar.gz` |
            | Windows x64 | `kast-win-x64-nightly.zip` |
            | Docker | `ghcr.io/${{ github.repository_owner }}/kast:nightly` |
          files: |
            kast-linux-x64-nightly.tar.gz
            kast-linux-arm64-nightly.tar.gz
            kast-win-x64-nightly.zip
