name: CI

on:
  push:
    branches: [main, develop]

env:
  DOTNET_VERSION: '10.0.x'
  DOCKER_IMAGE: kast

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool run dotnet-sonarscanner -- begin /k:"Foxlider_KAST" /o:"foxlicorp" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.coverage.exclusions="**/bin/**,**/obj/**,**/Data/Migrations/**" \
            /d:sonar.cs.opencover.reportsPaths="coverage.opencover.xml"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet tool run coverlet -- ./tests/KAST.Tests/bin/Release/net10.0/KAST.Tests.dll \
            --target "dotnet" \
            --targetargs "test ./tests/KAST.Tests/KAST.Tests.csproj \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger trx;LogFileName=test-results.trx" \
            --format opencover \
            --output coverage.opencover.xml \
            --include-directory "./src"

      - name: End SonarCloud analysis
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet tool run dotnet-sonarscanner -- end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4
      #   if: always()
      #   with:
      #     files: coverage.opencover.xml
      #     flags: unittests
      #     fail_ci_if_error: false
      #     token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Normalize repository owner
        id: repo
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Compute nightly version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "v0.0.0")
          BASE_VER="${LAST_TAG#v}"

          echo "version=${BASE_VER}-nightly.${DATE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/develop'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build Docker image (main — validate only, no push)
        if: github.ref != 'refs/heads/develop'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          load: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container health
        if: github.ref != 'refs/heads/develop'
        run: |
          docker run --detach --rm --name kast-smoke --publish 5000:5000 ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          trap 'docker logs kast-smoke; docker stop kast-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:5000/alive; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Build and push nightly image to GHCR
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/kast:nightly
            ghcr.io/${{ steps.repo.outputs.owner }}/kast:nightly-${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Nightly native binaries (develop only) ─────────────────────────────────
  nightly-packages:
    name: Nightly Package (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar
          - rid: linux-arm64
            archive: tar
          - rid: win-x64
            archive: zip
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute nightly version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "v0.0.0")
          BASE_VER="${LAST_TAG#v}"
          echo "version=${BASE_VER}-nightly.${DATE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=$DATE"       >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      - name: Publish
        run: |
          dotnet publish src/KAST.UI/KAST.UI.csproj \
            --configuration Release \
            --runtime      ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:MinVerVersionOverride=${{ steps.version.outputs.version }} \
            --output publish/${{ matrix.rid }}

      - name: Package → tar.gz
        if: matrix.archive == 'tar'
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf ../../kast-${{ matrix.rid }}-nightly.tar.gz .

      - name: Package → zip
        if: matrix.archive == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../kast-${{ matrix.rid }}-nightly.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-${{ matrix.rid }}
          path: kast-${{ matrix.rid }}-nightly.*
          if-no-files-found: error
          retention-days: 7

  # ── Rolling nightly GitHub pre-release ────────────────────────────────────
  nightly-release:
    name: Nightly Release
    runs-on: ubuntu-latest
    needs: nightly-packages
    if: github.ref == 'refs/heads/develop'
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute nightly version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "v0.0.0")
          BASE_VER="${LAST_TAG#v}"
          echo "version=${BASE_VER}-nightly.${DATE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Normalize repository owner
        id: repo
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Download nightly artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: nightly-*
          merge-multiple: true

      - name: Create or update nightly pre-release
        run: |
          cat > NIGHTLY_RELEASE_BODY.md <<'EOF'
          🌙 **Automated nightly build** from the `develop` branch.

          | | |
          |---|---|
          | **Version** | `${{ steps.version.outputs.version }}` |
          | **Commit** | [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Date** | `${{ steps.version.outputs.date }}` |

          > ⚠️ Nightly builds are automatically generated from the latest development code and may be unstable.
          > Use [tagged releases](../../releases/latest) for production deployments.

          ### Downloads
          | Platform | File |
          |---|---|
          | Linux x64 | `kast-linux-x64-nightly.tar.gz` |
          | Linux arm64 | `kast-linux-arm64-nightly.tar.gz` |
          | Windows x64 | `kast-win-x64-nightly.zip` |
          | Docker | `ghcr.io/${{ steps.repo.outputs.owner }}/kast:nightly` |
          EOF

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly \
              kast-linux-x64-nightly.tar.gz \
              kast-linux-arm64-nightly.tar.gz \
              kast-win-x64-nightly.zip \
              --clobber
            gh release edit nightly \
              --title "Nightly - ${{ steps.version.outputs.version }}" \
              --notes-file NIGHTLY_RELEASE_BODY.md \
              --prerelease
          else
            gh release create nightly \
              kast-linux-x64-nightly.tar.gz \
              kast-linux-arm64-nightly.tar.gz \
              kast-win-x64-nightly.zip \
              --target "${GITHUB_SHA}" \
              --title "Nightly - ${{ steps.version.outputs.version }}" \
              --notes-file NIGHTLY_RELEASE_BODY.md \
              --prerelease
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move nightly tag to current commit
        run: |
          git tag -f nightly "${GITHUB_SHA}"
          git push origin refs/tags/nightly --force
