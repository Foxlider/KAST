name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  DOCKER_IMAGE: kast
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install Coverlet tool
        run: dotnet tool install --global coverlet.console

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarCloud analysis
        run: |
          dotnet sonarscanner begin /k:"Foxlider_KAST" /o:"foxlicorp" \
            /d:sonar.token="${{ env.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.coverage.exclusions="**/bin/**,**/obj/**,**/Data/Migrations/**" \
            /d:sonar.cs.opencover.reportsPaths="coverage.opencover.xml"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          coverlet ./tests/KAST.Tests/bin/Release/net10.0/KAST.Tests.dll \
            --target "dotnet" \
            --targetargs "test ./tests/KAST.Tests/KAST.Tests.csproj \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger trx;LogFileName=test-results.trx" \
            --format opencover \
            --output coverage.opencover.xml \
            --include-directory "./src"

      - name: End SonarCloud analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"
        if: always()

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4
      #   if: always()
      #   with:
      #     files: coverage.opencover.xml
      #     flags: unittests
      #     fail_ci_if_error: false
      #     token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize repository owner
        id: repo
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Compute nightly version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "v0.0.0")
          BASE_VER="${LAST_TAG#v}"

          echo "version=${BASE_VER}-nightly.${DATE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (main / PR — validate only, no push)
        if: github.ref != 'refs/heads/develop'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nightly image to GHCR
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/kast:nightly
            ghcr.io/${{ steps.repo.outputs.owner }}/kast:nightly-${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
