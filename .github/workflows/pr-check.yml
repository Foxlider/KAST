name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  # ── Always runs on every PR ──────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "trx;LogFileName=test-results.trx" \
            --verbosity normal

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"MarkdownSummaryGithub;Html" \
            -title:"KAST Coverage — PR #${{ github.event.pull_request.number }}"

      - name: Post coverage summary
        run: cat ./coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload test results & coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-coverage-pr-${{ github.event.pull_request.number }}
          path: |
            **/TestResults/*.trx
            ./coverage/report/

