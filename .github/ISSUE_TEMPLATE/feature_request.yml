name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please search existing issues and discussions to see if this has already been proposed.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of KAST does this relate to?
      options:
        - Server Management
        - Mod Management
        - Steam / SteamKit2
        - API / Integrations
        - UI / UX
        - Docker / Deployment
        - Monitoring / Telemetry
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? What are you currently unable to do?
      placeholder: "I always have to manually ... because KAST doesn't ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like, as concretely as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about or tried?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, references to similar tools, related issues, etc.
