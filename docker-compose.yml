services:
  kast:
    build: .
    container_name: kast
    ports:
      - "5000:5000"
    volumes:
      - kast-data:/app/data
      - kast-mods:/app/mods
      - kast-servers:/app/servers
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Data Source=/app/data/kast.db

  nginx:
    image: nginx:alpine
    container_name: kast-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kast
    restart: unless-stopped

volumes:
  kast-data:
  kast-mods:
  kast-servers:
