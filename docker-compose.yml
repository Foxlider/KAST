services:
  kast:
    build: .
    container_name: kast
    ports:
      - "5000:5000"                  # Web UI / API
      # Arma 3 instance port blocks are UDP-only. Keep configured ports within this range.
      - "2302-2322:2302-2322/udp"
    volumes:
      - kast-data:/app/data
      - kast-mods:/app/mods
      - kast-servers:/app/servers
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Data Source=/app/data/kast.db
      # Server-rendered components must call Kestrel directly; port 80 is not Nginx inside this container.
      - Kast__InternalBaseUrl=http://localhost:5000
      - Telemetry__Enabled=true
      - Telemetry__OtlpEndpoint=http://jaeger:4317
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: kast-jaeger
    ports:
      - "16686:16686"   # Web UI
      - "4317:4317"     # OTLP gRPC receiver
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kast-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      kast:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kast-data:
  kast-mods:
  kast-servers:
